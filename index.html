<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Balance Calculator</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link href="css/styles.css" rel="stylesheet">

    </head>
    <body>
        <div class="app-shell">
            <header class="hero">
                <img class="hero-image" src="images/bg.jpg" alt="">
                <div class="hero-content">
                    <div class="hero-heading-row">
                        <p class="eyebrow">Budget overview</p>
                        <div class="select-wrap currency-wrap">
                            <select id="currency" aria-label="Currency">
                                <option value="PHP">PHP (&#8369;)</option>
                                <option value="USD">USD ($)</option>
                                <option value="EUR">EUR (&euro;)</option>
                                <option value="GBP">GBP (&pound;)</option>
                                <option value="JPY">JPY (&yen;)</option>
                                <option value="AUD">AUD (A$)</option>
                                <option value="CAD">CAD (CA$)</option>
                            </select>
                        </div>
                    </div>
                    <h2 id="date"></h2>
                    <p class="balance-label">Current balance</p>
                    <h1 id="balance">0.00</h1>
                    <div class="summary-grid">
                        <div class="amount-display green">
                            <span class="summary-label">Income</span>
                            <span class="summary-value"><span id="income">0.00</span><span id="income-percentage"></span></span>
                        </div>
                        <div class="amount-display red">
                            <span class="summary-label">Expenses</span>
                            <span class="summary-value"><span id="expenses">0.00</span><span id="expenses-percentage"></span></span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="content">
                <section class="entry-section" aria-label="Add a transaction">
                    <form id="entry-form" class="entry-bar">
                        <div class="select-wrap">
                            <select id="sign" name="sign" aria-label="Transaction type">
                                <option value="+">Income +</option>
                                <option value="-">Expense -</option>
                            </select>
                        </div>
                        <input id="description" type="text" placeholder="Description" aria-label="Description" required>
                        <input id="amount" type="number" min="0" step="0.01" placeholder="Amount" aria-label="Amount" required>
                        <div class="select-wrap category-wrap">
                            <select id="category" aria-label="Category" required></select>
                        </div>
                        <input id="entry-date" type="date" aria-label="Transaction date" required>
                        <div class="entry-actions">
                            <button id="enter" type="submit">Add entry</button>
                            <button id="cancel-edit" type="button" hidden>Cancel</button>
                        </div>
                    </form>
                </section>

                <div class="ledger-tools" aria-label="Filter transactions">
                    <label class="filter-control">Category
                        <span class="select-wrap filter-select-wrap">
                            <select id="category-filter" aria-label="Filter by category">
                                <option value="">All categories</option>
                            </select>
                        </span>
                    </label>
                    <label class="filter-control">From
                        <input id="date-from" type="date" aria-label="Start date">
                    </label>
                    <label class="filter-control">To
                        <input id="date-to" type="date" aria-label="End date">
                    </label>
                    <button id="clear-filters" type="button">Clear filters</button>
                </div>

                <section class="ledger-grid" aria-label="Transactions">
                    <section class="ledger-column">
                        <h2 class="ledger-title green-text">Income</h2>
                        <ul id="income-list" class="flex-list"></ul>
                    </section>
                    <section class="ledger-column">
                        <h2 class="ledger-title red-text">Expenses</h2>
                        <ul id="expense-list" class="flex-list"></ul>
                    </section>
                </section>
            </main>
        </div>
        <script src="app.js"></script>
    </body>
</html>
